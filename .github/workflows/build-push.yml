name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  # Manual trigger with optional version override
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version (leave empty for auto-bump)'
        required: false
        default: ''

env:
  DOCKER_USER: lynchz
  SERVER_IMAGE: lynchz/trader-ahh-server
  CLIENT_IMAGE: lynchz/trader-ahh-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push tags
      packages: write  # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tags

      - name: Check if commit is already tagged
        id: check_tagged
        run: |
          # Check if current commit already has a version tag
          CURRENT_TAGS=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "${CURRENT_TAGS}" ]; then
            echo "Current commit is already tagged: ${CURRENT_TAGS}"
            echo "ALREADY_TAGGED=true" >> $GITHUB_OUTPUT
            echo "EXISTING_TAG=${CURRENT_TAGS}" >> $GITHUB_OUTPUT
          else
            echo "Current commit is not tagged yet"
            echo "ALREADY_TAGGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if already tagged
        if: steps.check_tagged.outputs.ALREADY_TAGGED == 'true'
        run: |
          echo "## ⏭️ Skipped - Commit Already Tagged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This commit already has tag: \`${{ steps.check_tagged.outputs.EXISTING_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No new build needed." >> $GITHUB_STEP_SUMMARY

      - name: Calculate version
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true'
        id: version
        run: |
          # Get latest tag or default to 1.4.6
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.4.6")
          LATEST_VERSION=${LATEST_TAG#v}

          echo "Latest version: ${LATEST_VERSION}"

          # If manual override provided, use it
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            NEW_VERSION="${{ github.event.inputs.version_override }}"
            echo "Using manual override: ${NEW_VERSION}"
          else
            # Parse current version
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_VERSION}"

            # Get commit message
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Commit message: ${COMMIT_MSG}"

            # Determine bump type from commit message prefix
            if echo "${COMMIT_MSG}" | grep -iqE "^major(\(.+\))?:"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              BUMP_TYPE="major"
            elif echo "${COMMIT_MSG}" | grep -iqE "^feat(\(.+\))?:"; then
              MINOR=$((MINOR + 1))
              PATCH=0
              BUMP_TYPE="minor"
            elif echo "${COMMIT_MSG}" | grep -iqE "^(fix|refactor|style|perf|chore)(\(.+\))?:"; then
              PATCH=$((PATCH + 1))
              BUMP_TYPE="patch"
            else
              echo "No version bump prefix found (fix/feat/major/refactor/style/perf/chore). Skipping build."
              echo "SKIP=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Bump type: ${BUMP_TYPE}"
          fi

          # Check if this tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/v${NEW_VERSION}$"; then
            echo "⚠️ Tag v${NEW_VERSION} already exists on remote!"
            echo "This can happen when workflow runs twice for the same version."
            echo "Incrementing patch version to avoid conflict..."

            # Keep incrementing until we find an unused version
            IFS='.' read -r MAJOR MINOR PATCH <<< "${NEW_VERSION}"
            while git ls-remote --tags origin | grep -q "refs/tags/v${MAJOR}.${MINOR}.${PATCH}$"; do
              PATCH=$((PATCH + 1))
            done
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Using next available version: ${NEW_VERSION}"
          fi

          echo "New version: ${NEW_VERSION}"
          echo "VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "SKIP=false" >> $GITHUB_OUTPUT

      - name: Lowercase Registry Owner
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Skip if no version bump
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP == 'true'
        run: |
          echo "No version bump commit prefix found. Skipping Docker build."
          echo "Use commit prefixes: fix:, feat:, or major: to trigger a build."

      - name: Set up QEMU
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server image
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.SERVER_IMAGE }}:latest
            ghcr.io/${{ env.REPO_OWNER }}/trader-ahh-server:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.REPO_OWNER }}/trader-ahh-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client image
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.CLIENT_IMAGE }}:latest
            ghcr.io/${{ env.REPO_OWNER }}/trader-ahh-client:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.REPO_OWNER }}/trader-ahh-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"

          # Double-check tag doesn't exist (safety net)
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "⚠️ Tag ${TAG} already exists on remote, skipping tag creation"
            echo "Docker images were still pushed with this version tag"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "✅ Created and pushed tag ${TAG}"
          fi

      - name: Summary
        if: steps.check_tagged.outputs.ALREADY_TAGGED != 'true' && steps.version.outputs.SKIP != 'true'
        run: |
          echo "## 🚀 Release v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DockerHub Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.SERVER_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.CLIENT_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Packages (GHCR)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.REPO_OWNER }}/trader-ahh-server:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.REPO_OWNER }}/trader-ahh-client:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Git Tag Created" >> $GITHUB_STEP_SUMMARY
          echo "- \`v${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
